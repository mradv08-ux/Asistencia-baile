<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Asistencia de Baile Urbano</title>
<meta name="description" content="Pasa lista en tus clases de baile urbano y mira la asistencia de cada niño. Una app de The Wild Side.">
<meta name="author" content="The Wild Side">
<meta name="theme-color" content="#F6F1FB" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1D1726" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Asistencia">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta property="og:title" content="Asistencia de Baile Urbano">
<meta property="og:description" content="Pasa lista en tus clases de baile urbano.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Kaushan+Script&family=Sedgwick+Ave+Display&family=Tilt+Neon&family=Permanent+Marker&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: una sola columna tipo app móvil, cabecera con mariposa, pestañas abajo; lavanda de base y crema en las tarjetas */
/* Colores: todo sale de --h (tono) y --s (intensidad); cada profe elige su paleta en «Colores» */
:root{
  --h:262; --s:1;
  --bg:hsl(var(--h) calc(var(--s) * 60%) 96%);
  --surface:#FFFCF5;
  --cream:#F4E9D3;
  --ink:hsl(var(--h) calc(var(--s) * 25%) 24%);
  --muted:hsl(var(--h) calc(var(--s) * 13%) 50%);
  --line:hsl(var(--h) calc(var(--s) * 45%) 90%);
  --accent:hsl(var(--h) calc(var(--s) * 50%) 66%);
  --accent-strong:hsl(var(--h) calc(var(--s) * 35%) 47%);
  --accent-soft:hsl(var(--h) calc(var(--s) * 60%) 93%);
  --on-accent:#FFFFFF;
  --si:hsl(var(--h) calc(var(--s) * 50%) 60%);
  --tarde:#C9974A;
  --tarde-soft:#F7EBD4;
  --no:#C97A93;
  --no-soft:#F7E2E8;
  --shadow:0 1px 2px hsl(var(--h) 40% 30% / .06),0 6px 18px hsl(var(--h) 40% 30% / .07);
  --f-display:"Bebas Neue","Impact","Arial Narrow",sans-serif;
  --f-tag:"Permanent Marker","Marker Felt","Comic Sans MS",cursive;
  --tws:#08802a;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:hsl(var(--h) calc(var(--s) * 25%) 12%);--surface:hsl(var(--h) calc(var(--s) * 18%) 16%);--cream:#3A3226;--ink:hsl(var(--h) calc(var(--s) * 55%) 94%);--muted:hsl(var(--h) calc(var(--s) * 17%) 68%);--line:hsl(var(--h) calc(var(--s) * 20%) 23%);
  --accent:hsl(var(--h) calc(var(--s) * 65%) 77%);--accent-strong:hsl(var(--h) calc(var(--s) * 80%) 85%);--accent-soft:hsl(var(--h) calc(var(--s) * 26%) 22%);--on-accent:hsl(var(--h) calc(var(--s) * 25%) 12%);
  --si:hsl(var(--h) calc(var(--s) * 65%) 77%);--tarde:#E1B66E;--tarde-soft:#3D3122;--no:#E499B0;--no-soft:#432631;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);--tws:#00c837;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:hsl(var(--h) calc(var(--s) * 25%) 12%);--surface:hsl(var(--h) calc(var(--s) * 18%) 16%);--cream:#3A3226;--ink:hsl(var(--h) calc(var(--s) * 55%) 94%);--muted:hsl(var(--h) calc(var(--s) * 17%) 68%);--line:hsl(var(--h) calc(var(--s) * 20%) 23%);
  --accent:hsl(var(--h) calc(var(--s) * 65%) 77%);--accent-strong:hsl(var(--h) calc(var(--s) * 80%) 85%);--accent-soft:hsl(var(--h) calc(var(--s) * 26%) 22%);--on-accent:hsl(var(--h) calc(var(--s) * 25%) 12%);
  --si:hsl(var(--h) calc(var(--s) * 65%) 77%);--tarde:#E1B66E;--tarde-soft:#3D3122;--no:#E499B0;--no-soft:#432631;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);--tws:#00c837;color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent-strong);outline-offset:2px;border-radius:10px}

.app{position:relative;z-index:1;max-width:540px;margin:0 auto;min-height:100%;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(96px + env(safe-area-inset-bottom,0px))}

header.top{position:relative;display:flex;align-items:center;gap:12px;padding-block:26px 30px;margin-bottom:6px}
header.top::before{content:"";position:absolute;inset:8px -8px 14px;pointer-events:none;opacity:.7;border-radius:14px;
  background:
   repeating-linear-gradient(to bottom,transparent 0 17px,var(--line) 17px 18px),
   repeating-linear-gradient(to right,transparent 0 35px,var(--line) 35px 36px) 0 0/100% 18px,
   repeating-linear-gradient(to right,transparent 0 17px,var(--line) 17px 18px,transparent 18px 36px) 0 18px/100% 18px;
  -webkit-mask:linear-gradient(to bottom,#000 55%,transparent);mask:linear-gradient(to bottom,#000 55%,transparent)}
header.top > .logo{position:relative}
header.top > .titulo{position:relative;flex:1;min-width:0;padding-right:46px}
.cinta{position:absolute;left:62px;bottom:4px;height:30px;width:min(250px,60%);color:var(--accent);pointer-events:none}
.cinta .trazo{stroke-dasharray:400;stroke-dashoffset:400;animation:cinta 1s .2s ease-out forwards}
.cinta .gota{transform-box:fill-box;transform-origin:top;transform:scaleY(0);animation:gotea 1.4s 1s ease-in forwards}
@keyframes gotea{to{transform:scaleY(1)}}
@keyframes cinta{to{stroke-dashoffset:0}}
.notas{position:absolute;right:54px;top:22px;display:flex;gap:3px;align-items:flex-end;height:30px;opacity:.85}
.notas i{display:block;width:5px;border-radius:2px;background:var(--accent);height:30%;transform-origin:bottom;animation:eq 1.1s ease-in-out infinite alternate}
.notas i:nth-child(2n){background:var(--accent-strong)}
.notas i:nth-child(1){animation-delay:-.2s}.notas i:nth-child(2){animation-delay:-.7s}.notas i:nth-child(3){animation-delay:-.4s}.notas i:nth-child(4){animation-delay:-.9s}.notas i:nth-child(5){animation-delay:-.1s}.notas i:nth-child(6){animation-delay:-.55s}
@keyframes eq{0%{height:20%}50%{height:100%}100%{height:45%}}
.logo{width:52px;height:52px;flex:none;color:var(--accent);background:var(--surface);border-radius:50%;padding:6px;box-shadow:var(--shadow)}
.logo .w2{color:var(--accent-strong)}
header h1 b{font-weight:400}
header h1{font-family:var(--f-display);font-weight:400;font-size:38px;line-height:.9;margin:0;letter-spacing:.02em;text-wrap:balance;text-shadow:2px 2px 0 var(--accent-soft)}
header h1 span{display:block;font-family:var(--f-tag);font-size:19px;letter-spacing:0;color:var(--accent-strong);text-shadow:none;transform:rotate(-3deg);margin:2px 0 0 4px}
header p{margin:8px 0 0;color:var(--muted);font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:600}

.banner{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--cream);border-radius:14px;padding:10px 12px;font-size:14px;margin-bottom:14px}
.banner span{flex:1 1 200px;min-width:0}
.banner button{border:0;background:transparent;color:var(--accent-strong);font-weight:600;padding:6px 4px;text-decoration:underline;text-underline-offset:3px}

.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:500;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent-strong);border-color:var(--accent-strong);color:var(--bg)}
.chip small{opacity:.75;font-weight:400;margin-left:4px}

.datebar{display:flex;align-items:center;gap:8px;background:var(--surface);border-radius:16px;padding:6px;box-shadow:var(--shadow);margin-bottom:14px}
.datebar .arrow{width:42px;height:42px;border:0;border-radius:12px;background:var(--accent-soft);color:var(--accent-strong);font-size:20px;flex:none}
.datebar label{flex:1;min-width:0;text-align:center;position:relative}
.datebar .dlabel{display:block;font-family:var(--f-display);font-size:28px;line-height:1;letter-spacing:.03em}
.datebar .dsub{display:block;font-size:12px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.datebar input{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer}

.summary{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:6px 2px 10px}
.summary .big{font-family:var(--f-display);font-size:52px;line-height:.9}
.summary .big small{font-family:var(--f-body);font-size:15px;color:var(--muted);margin-left:6px}
.linkbtn{border:2px solid var(--accent-strong);background:var(--accent-soft);color:var(--accent-strong);font-family:var(--f-tag);font-size:15px;padding:7px 14px;border-radius:10px;transform:rotate(-2deg);box-shadow:3px 3px 0 var(--accent-strong)}
.linkbtn:active{transform:rotate(-2deg) translate(2px,2px);box-shadow:1px 1px 0 var(--accent-strong)}

.list{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.row{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:16px;padding:10px 10px 10px 12px;box-shadow:var(--shadow);min-width:0}
.avatar{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;font-size:14px;background:var(--accent-soft);color:var(--accent-strong);position:relative}
.row.is-si .avatar{background:var(--si);color:var(--on-accent)}
.row .who{flex:1;min-width:0}
.row .name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .meta{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.seg{display:flex;flex:none;background:var(--bg);border-radius:12px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:9px;padding:8px 9px;font-size:13px;font-weight:600;color:var(--muted);min-width:44px}
.seg button[aria-pressed="true"].s-si{background:var(--si);color:var(--on-accent)}
.seg button[aria-pressed="true"].s-tarde{background:var(--tarde-soft);color:var(--tarde)}
.seg button[aria-pressed="true"].s-no{background:var(--no-soft);color:var(--no)}

.flutter{position:absolute;inset:-6px;pointer-events:none;color:var(--accent);opacity:0}
.flutter.go{animation:fly .9s ease-out}
@keyframes fly{0%{opacity:0;transform:translate(0,0) scale(.6)}25%{opacity:1}100%{opacity:0;transform:translate(14px,-26px) scale(1) rotate(12deg)}}

.dots{display:grid;grid-template-columns:repeat(3,9px);gap:2px;flex:none}
.dot{width:9px;height:9px;border-radius:2px;background:var(--line)}
.dot.si{background:var(--si)}.dot.tarde{background:var(--tarde)}.dot.no{background:transparent;box-shadow:inset 0 0 0 1.5px var(--no)}
.avatar.pirueta{animation:pirueta .7s cubic-bezier(.3,.1,.3,1)}
@keyframes pirueta{to{transform:rotateY(360deg)}}
.partitura{background:var(--ink);border-radius:16px;padding:12px;margin:0 0 16px}
.partitura .cab{display:flex;justify-content:space-between;align-items:center;color:var(--bg);font-family:var(--f-display);font-size:18px;letter-spacing:.08em;margin-bottom:10px}
.partitura .cab small{font-family:var(--f-body);font-size:11px;opacity:.7;letter-spacing:.1em}
.pads{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.pad{aspect-ratio:1;max-width:100%;border-radius:6px;background:color-mix(in srgb,var(--bg) 14%,transparent);display:grid;place-items:center;font-size:9px;font-weight:700;color:var(--ink)}
.pad.si{background:var(--si);box-shadow:0 0 10px var(--si)}
.pad.tarde{background:var(--tarde)}
.pad.no{background:transparent;box-shadow:inset 0 0 0 2px var(--no)}
.partitura .ley{display:flex;gap:14px;justify-content:center;font-size:12px;color:var(--bg);opacity:.8;padding-top:10px;flex-wrap:wrap}
.partitura .ley i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:middle}
.pct{font-variant-numeric:tabular-nums;font-weight:700;font-size:15px;min-width:44px;text-align:right}
.rowbtn{all:unset;display:flex;align-items:center;gap:12px;flex:1;min-width:0;cursor:pointer}

.search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.section-title{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:18px 2px 8px;font-weight:600}

.empty{text-align:center;padding:36px 16px;color:var(--muted)}
.empty svg{width:64px;height:64px;color:var(--accent);opacity:.8}
.empty h2{font-family:var(--f-tag);font-weight:400;color:var(--accent-strong);font-size:24px;margin:8px 0 6px;transform:rotate(-2deg)}
.empty p{margin:0 auto 16px;max-width:30ch}

.primary{border:0;background:var(--accent-strong);color:var(--bg);font-weight:600;border-radius:14px;padding:13px 18px;font-size:16px}
.ghost{border:1px solid var(--line);background:transparent;border-radius:14px;padding:12px 16px;font-weight:600}
.danger{border:0;background:var(--no-soft);color:var(--no);border-radius:14px;padding:12px 16px;font-weight:600}

.fab{position:fixed;right:max(16px,calc(50% - 254px),env(safe-area-inset-right,0px));bottom:calc(84px + env(safe-area-inset-bottom,0px));border:0;border-radius:999px;background:var(--accent-strong);color:var(--bg);font-weight:600;padding:14px 20px;box-shadow:0 8px 22px rgba(80,55,120,.28);display:flex;gap:6px;align-items:center;z-index:5}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
nav.tabs .in{max-width:540px;margin:0 auto;display:grid;grid-auto-flow:column;grid-auto-columns:1fr}
nav.tabs button{border:0;background:transparent;padding:10px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:600;color:var(--muted)}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button[aria-current="page"]{color:var(--accent-strong)}

/* hoja inferior */
.scrim{position:fixed;inset:0;background:rgba(40,25,60,.35);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:540px;border-radius:24px 24px 0 0;max-height:88%;overflow:auto;padding-block:10px calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
.grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 12px}
.sheet h2{font-family:var(--f-display);font-weight:400;font-size:36px;line-height:1;letter-spacing:.02em;margin:0 0 4px}
.sheet .sub{color:var(--muted);margin:0 0 14px;font-size:14px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:12px;width:100%}
.days{display:flex;gap:6px;flex-wrap:wrap}
.days button{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--bg);font-weight:600}
.days button[aria-pressed="true"]{background:var(--accent-strong);border-color:var(--accent-strong);color:var(--bg)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.actions .primary{flex:1 1 160px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 16px}
.stat{background:var(--bg);border-radius:14px;padding:10px;text-align:center}
.stat b{display:block;font-family:var(--f-display);font-size:34px;font-weight:400;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.hist li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 2px;border-bottom:1px solid var(--line);font-size:15px}
.tag{font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px}
.tag.si{background:var(--accent-soft);color:var(--si)}.tag.tarde{background:var(--tarde-soft);color:var(--tarde)}.tag.no{background:var(--no-soft);color:var(--no)}

.backup{background:var(--surface);border-radius:16px;padding:14px;box-shadow:var(--shadow)}
.backup p{margin:0 0 10px;font-size:14px;color:var(--muted)}
.backup label.ghost{display:inline-block;cursor:pointer;color:var(--ink)}
.backup .meta{margin:10px 0 0;font-size:13px}

.fondo-mariposa{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.fondo-mariposa .tribal{position:absolute;inset:-40px;background-image:var(--tribal);background-size:460px 460px;opacity:.7;animation:flota 60s linear infinite}
@keyframes flota{to{background-position:460px -460px}}
:root.d-mariposa header.top::before{display:none}
:root.d-mariposa .logo{background:transparent;box-shadow:none;color:#FF6EC7;filter:drop-shadow(0 0 4px #FF6EC7) drop-shadow(0 0 10px #C59BFF)}
:root.d-mariposa .logo .w2{color:#C59BFF}
:root.d-mariposa header h1 b{font-family:"Sedgwick Ave Display","Permanent Marker","Figtree",sans-serif;font-weight:400;font-size:58px;line-height:1;letter-spacing:.01em;color:#FFE9F7;display:inline-block;transform:rotate(-4deg);transform-origin:left bottom;padding-right:.15em;
  text-shadow:0 0 3px #fff,0 0 9px #FF6EC7,0 0 20px #FF6EC7,0 0 38px #FF3DB0,0 0 64px #C59BFF;animation:neon-on 1.8s ease-out 1,neon-parpadeo 8s 2s infinite}
:root.d-mariposa #lema{font-family:"Tilt Neon","Figtree",sans-serif;font-size:17px;letter-spacing:.06em;color:#EEDDFF;transform:none;margin:6px 0 0 2px;
  text-shadow:0 0 3px #fff,0 0 8px #C59BFF,0 0 18px #C59BFF,0 0 30px #9B6BFF}
@keyframes neon-on{0%{opacity:.08}8%{opacity:1}11%{opacity:.25}18%{opacity:1}22%{opacity:.45}30%,100%{opacity:1}}
@keyframes neon-parpadeo{0%,90%,100%{opacity:1}91%{opacity:.55}92%{opacity:1}95%{opacity:.75}96%{opacity:1}}
:root.d-mariposa .linkbtn{box-shadow:3px 3px 0 #FF6EC7,0 0 16px rgb(255 110 199 / .45)}
:root.d-mariposa .partitura{background:#0D0812;box-shadow:inset 0 0 0 1px var(--line)}
:root.d-mariposa .partitura .cab,:root.d-mariposa .partitura .ley{color:#fff}
:root.d-mariposa .pad{background:rgb(255 255 255 / .07)}
:root.d-mariposa .pad.si{background:#FF6EC7;box-shadow:0 0 12px #FF6EC7}
:root.d-mariposa .pad.tarde{background:#C59BFF;box-shadow:0 0 10px #C59BFF}
:root.d-mariposa .pad.no{background:transparent;box-shadow:inset 0 0 0 2px #9B8AA8}
.mini.mini-neon{background:#150E1C var(--tribal) 0 0/230px 230px}
.mini-neon b{font-family:"Sedgwick Ave Display","Permanent Marker",sans-serif;font-weight:400;font-size:30px;transform:rotate(-4deg);transform-origin:left bottom;color:#FFE9F7;text-shadow:0 0 3px #fff,0 0 8px #FF6EC7,0 0 18px #FF6EC7}
.mini-neon i{background:#21172B}

:root.d-clara{
  --bg:#140C07;--surface:#22160E;--cream:#2D1E13;--ink:#FFF6EA;--muted:#D9BC92;--line:#4A3320;
  --accent:#E9B949;--accent-strong:#FF3DA8;--accent-soft:#3B2716;--on-accent:#140C07;--si:#FF3DA8;
  --tarde:#E9B949;--tarde-soft:#3A2B12;--no:#B49C86;--no-soft:#2B1F16;--tws:#00c837;
  --shadow:0 1px 2px rgba(0,0,0,.45),0 6px 18px rgba(0,0,0,.35);color-scheme:dark}
.fondo-clara{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.fondo-clara .leo{position:absolute;inset:0;background-image:var(--leopardo);background-size:300px 300px;opacity:1}
.fondo-clara::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgb(20 12 7 / .88) 0,rgb(20 12 7 / .7) 150px,rgb(20 12 7 / .15) 300px,transparent 55%,rgb(20 12 7 / .35))}
:root.d-clara .summary{background:rgb(20 12 7 / .82);border-radius:16px;padding:12px 12px 12px 14px;box-shadow:inset 0 0 0 1px rgb(233 185 73 / .45)}
:root.d-clara .empty{background:rgb(20 12 7 / .85);border-radius:20px;box-shadow:inset 0 0 0 1px rgb(233 185 73 / .45);margin-top:10px}
:root.d-clara .section-title{display:inline-block;background:rgb(20 12 7 / .85);color:#FFF6EA;padding:4px 10px;border-radius:8px}
:root.d-clara .loading{background:rgb(20 12 7 / .85);border-radius:20px}
/* toque racheta: marco dorado en tarjetas y botones con brillo */
:root.d-clara .row,:root.d-clara .datebar,:root.d-clara .backup,:root.d-clara .search,:root.d-clara .stat{box-shadow:inset 0 0 0 1px rgb(233 185 73 / .45),var(--shadow)}
:root.d-clara .chip{border-color:rgb(233 185 73 / .55)}
:root.d-clara .primary,:root.d-clara .fab,:root.d-clara .chip[aria-pressed="true"]{background:linear-gradient(135deg,#FF3DA8,#FF6EC2 45%,#FF3DA8 55%,#E01F8C);box-shadow:0 0 0 1.5px #E9B949,0 6px 18px rgb(255 61 168 / .35)}
:root.d-clara .avatar{box-shadow:0 0 0 1.5px #E9B949}
:root.d-clara .firma span,:root.d-musa .firma span,:root.d-mariposa .firma span{background:rgb(0 0 0 / .6)}
:root.d-clara .summary .big,:root.d-clara .dlabel,:root.d-clara .section-title,:root.d-clara #subtitulo{text-shadow:0 1px 3px rgb(0 0 0 / .8)}
.fondo-clara svg{position:absolute;color:#fff;opacity:0;animation:brilla var(--t,3s) var(--d,0s) ease-in-out infinite}
@keyframes brilla{0%,100%{opacity:0;transform:scale(.3) rotate(0)}50%{opacity:var(--o,.9);transform:scale(1) rotate(25deg)}}
:root.d-clara header.top::before,:root.d-clara .logo{display:none}
:root.d-clara header h1 b{font-family:"Kaushan Script","Brush Script MT",cursive;font-size:46px;line-height:1.05;letter-spacing:0;color:#fff;text-shadow:2px 2px 0 #FF3DA8,-1px -1px 0 #140C07,1px -1px 0 #140C07,-1px 1px 0 #140C07,3px 4px 0 #140C07,0 0 22px rgb(255 61 168 / .5)}
:root.d-clara header h1 span{font-family:"Kaushan Script","Brush Script MT",cursive;font-size:32px;line-height:1;margin:-4px 0 0 96px;transform:rotate(-5deg);
  background:linear-gradient(100deg,#E9B949 0%,#FFF3C4 16%,#C8902A 32%,#FF3DA8 50%,#FFE7A3 66%,#E9B949 84%);background-size:260% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:brilli 5s linear infinite}
@keyframes brilli{to{background-position:-260% 0}}
:root.d-clara .linkbtn{box-shadow:3px 3px 0 #E9B949;border-color:#E9B949}
:root.d-clara .partitura{background:#0B080B;box-shadow:inset 0 0 0 1px var(--line)}
:root.d-clara .partitura .cab,:root.d-clara .partitura .ley{color:#fff}
:root.d-clara .pad{background:rgb(255 255 255 / .07)}
:root.d-clara .pad.si{background:#FF3DA8;box-shadow:0 0 12px #FF3DA8}
:root.d-clara .pad.tarde{background:#E9B949}
:root.d-clara .pad.no{background:transparent;box-shadow:inset 0 0 0 2px #A99AA4}
.mini.mini-clara{background:#140C07 var(--leopardo) 0 0/150px 150px;box-shadow:inset 0 0 0 1px #E9B949}
.mini-clara b{font-family:"Kaushan Script","Brush Script MT",cursive;color:#fff;font-size:22px;text-shadow:2px 2px 0 #FF3DA8}
.mini-clara i{background:#221A21}
.nota-colores{background:var(--bg);border-radius:14px;padding:12px 14px;color:var(--muted);font-size:14px;margin:0 0 8px}

:root.d-musa{
  --bg:#0B0A10;--surface:#17151F;--cream:#1E1B29;--ink:#FFFFFF;--muted:#A9A3BA;--line:#2A2638;
  --accent:#8B3DFF;--accent-strong:#D4F53C;--accent-soft:#251A3F;--on-accent:#0B0A10;--si:#D4F53C;
  --tarde:#A472FF;--tarde-soft:#2A1E4A;--no:#8E879E;--no-soft:#211E2B;--tws:#00c837;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 6px 18px rgba(0,0,0,.4);color-scheme:dark}
.fondo-musa{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.fondo-musa .b1,.fondo-musa .b2{position:absolute;aspect-ratio:600/260;background-position:center;background-size:contain;background-repeat:no-repeat}
.fondo-musa .b1{background-image:var(--brocha-lima);width:min(130vw,820px);left:-62%;top:44%;transform:rotate(-38deg);opacity:.34}
.fondo-musa .b2{background-image:var(--brocha-morada);width:min(140vw,880px);right:-62%;bottom:4%;transform:scaleX(-1) rotate(-38deg);opacity:.6}
.fondo-musa .puntos{position:absolute;right:-20px;top:120px;width:200px;height:260px;opacity:.55;
  background-image:radial-gradient(circle,#8B3DFF 2.2px,transparent 2.6px);background-size:14px 14px;
  -webkit-mask:linear-gradient(225deg,#000 20%,transparent 75%);mask:linear-gradient(225deg,#000 20%,transparent 75%)}
:root.d-musa header.top::before,:root.d-musa .logo{display:none}
:root.d-musa header h1 b{display:flex;align-items:flex-end;gap:2px;font-family:var(--f-display);font-size:58px;line-height:.82;letter-spacing:.01em;color:#fff;text-shadow:none}
header h1 .musa-logo{font-size:inherit;font-family:inherit;letter-spacing:inherit;color:inherit;transform:none;margin:0;text-shadow:none}
.musa-logo span{font-family:var(--f-display);font-size:inherit;letter-spacing:inherit;color:#fff;transform:none;margin:0;text-shadow:none;display:inline}
.musa-logo .la{writing-mode:vertical-rl;transform:rotate(180deg);color:#D4F53C;font-size:24px;line-height:.9;letter-spacing:.04em}
.musa-logo .m{color:#8B3DFF}
:root.d-musa #lema{font-family:var(--f-display);font-size:14px;letter-spacing:.42em;color:#fff;transform:none;margin:8px 0 0 2px;display:flex;align-items:center;gap:8px}
:root.d-musa #lema svg{width:20px;height:11px;color:#8B3DFF}
.corona{width:30px;height:24px;color:#D4F53C;margin:0 6px 0 4px;vertical-align:6px}
:root.d-musa .partitura{background:#05040A;box-shadow:inset 0 0 0 1px var(--line)}
:root.d-musa .partitura .cab,:root.d-musa .partitura .ley{color:#fff}
:root.d-musa .pad{background:rgb(255 255 255 / .07)}
:root.d-musa .pad.si{background:#D4F53C;box-shadow:0 0 12px #D4F53C}
:root.d-musa .pad.tarde{background:#8B3DFF}
:root.d-musa .pad.no{background:transparent;box-shadow:inset 0 0 0 2px #8E879E}
.mini.mini-musa{background:#0B0A10}
.mini-musa::before{content:"";position:absolute;width:190px;aspect-ratio:600/260;right:-40px;bottom:-30px;background:var(--brocha-morada) center/contain no-repeat;transform:scaleX(-1) rotate(-30deg)}
.mini-musa::after{content:"";position:absolute;width:150px;aspect-ratio:600/260;left:-50px;top:-20px;background:var(--brocha-lima) center/contain no-repeat;transform:rotate(-30deg);opacity:.8}
.mini-musa b{display:flex;align-items:flex-end;gap:1px;font-family:var(--f-display);color:#fff;font-size:30px;line-height:.85;z-index:1}
.mini-musa b .la{font-size:13px}
.mini-musa i{background:#17151F;z-index:1}
/* ---------- Colores ---------- */
.btn-tema{position:absolute;top:14px;right:0;width:42px;height:42px;border-radius:50%;border:0;background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center;color:var(--accent-strong);padding:0}
.btn-tema svg{width:22px;height:22px}
.disenos{display:grid;grid-template-columns:1fr;gap:10px;margin:4px 0 6px}
.disenos button{border:1px solid var(--line);background:var(--bg);border-radius:16px;padding:8px 8px 10px;display:flex;flex-direction:column;gap:8px;align-items:stretch;font-weight:600;font-size:14px;color:var(--ink)}
.disenos button[aria-pressed="true"]{border-color:var(--accent-strong);box-shadow:0 0 0 2px var(--accent-strong);background:var(--accent-soft)}
.mini{position:relative;height:110px;border-radius:10px;background:var(--bg);overflow:hidden;text-align:left;padding:8px 10px;box-shadow:inset 0 0 0 1px var(--line)}
.mini b{position:relative;display:block;font-family:var(--f-display);font-weight:400;font-size:24px;line-height:1;color:var(--ink)}
.mini i{position:relative;display:block;height:9px;border-radius:4px;background:var(--surface);margin-top:7px;box-shadow:var(--shadow)}
.mini i + i{width:80%}
.mini svg{position:absolute;width:170px;height:170px;right:-30px;top:8px;transform:rotate(-16deg);color:var(--accent);opacity:.35}
.mini svg .w2{color:var(--accent-strong)}
.exclusivo{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-strong);background:var(--accent-soft);border-radius:999px;padding:3px 9px;margin-bottom:8px}
.temas{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:4px 0 8px}
.temas button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:6px;padding:6px 2px;border-radius:14px;font-size:12px;font-weight:600;color:var(--muted)}
.temas .muestra{width:46px;height:46px;border-radius:50%;box-shadow:inset 0 0 0 1px rgb(0 0 0 / .06)}
.temas button[aria-pressed="true"]{background:var(--accent-soft);color:var(--ink)}
.temas button[aria-pressed="true"] .muestra{outline:3px solid var(--accent-strong);outline-offset:2px}
/* ---------- Entrar con código ---------- */
.entrar{padding-block:8px 0}
.entrar h2{font-family:var(--f-display);font-weight:400;font-size:40px;line-height:.95;letter-spacing:.02em;margin:0 0 8px}
.entrar > p{color:var(--muted);margin:0 0 18px;max-width:36ch}
.entrar .tarjeta{background:var(--surface);border-radius:18px;padding:18px;box-shadow:var(--shadow)}
#codigo{font-size:22px;letter-spacing:.14em;text-transform:uppercase;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.error{color:var(--no);font-size:14px;font-weight:600;min-height:1.2em;margin:-4px 0 10px}
.legal-link{text-align:center;margin-top:16px;font-size:14px}
.legal-link a{color:var(--muted)}
header p.estado{display:inline-block;margin-top:8px;font-size:12px;padding:3px 10px;border-radius:999px;background:var(--tarde-soft);color:var(--tarde);letter-spacing:0;text-transform:none}
.codigo-grande{font-family:var(--f-display);font-size:clamp(26px,9vw,38px);white-space:nowrap;letter-spacing:.08em;text-align:center;background:var(--bg);border-radius:14px;padding:14px 8px;margin:6px 0 14px;user-select:all;font-variant-numeric:tabular-nums}
.mensaje{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:12px;font-size:14px;resize:none}
.pill{font-size:12px;font-weight:700;border-radius:999px;padding:4px 10px;flex:none}
.pill.on{background:var(--accent-soft);color:var(--si)}.pill.off{background:var(--no-soft);color:var(--no)}
.resumen-profes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 14px}
/* ---------- Firma de The Wild Side ---------- */
.firma{display:flex;justify-content:center;margin:28px 0 56px}
.firma span{display:inline-flex;align-items:baseline;gap:7px;padding:7px 14px;border:1.5px dashed var(--tws);border-radius:10px;transform:rotate(-2deg);color:var(--muted);font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:600}
.firma b{font-family:var(--f-tag);font-weight:400;font-size:17px;letter-spacing:0;text-transform:none;color:var(--tws)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:30;max-width:calc(100% - 32px)}
.loading{text-align:center;padding:60px 0;color:var(--muted)}

<script>
(() => {
"use strict";
const DIAS = [{v:1,l:"L"},{v:2,l:"M"},{v:3,l:"X"},{v:4,l:"J"},{v:5,l:"V"},{v:6,l:"S"},{v:0,l:"D"}];
const DIA_NOMBRE = ["dom","lun","mar","mié","jue","vie","sáb"];
const LS = "asistencia-baile-v1";
const state = { grupos:{}, alumnos:{}, asistencia:{}, ajustes:{} };
/* ---------- Paletas de color ---------- */
const PALETAS = [
  {id:"lavanda",nombre:"Lavanda",h:262,s:1},{id:"fucsia",nombre:"Fucsia",h:300,s:.9},{id:"rosa",nombre:"Rosa",h:335,s:.9},{id:"coral",nombre:"Coral",h:8,s:1},
  {id:"naranja",nombre:"Naranja",h:26,s:1.1},{id:"mostaza",nombre:"Mostaza",h:44,s:1.1},{id:"verde",nombre:"Verde",h:140,s:.6},{id:"menta",nombre:"Menta",h:162,s:.8},
  {id:"turquesa",nombre:"Turquesa",h:186,s:.9},{id:"cielo",nombre:"Cielo",h:206,s:1},{id:"indigo",nombre:"Índigo",h:232,s:.9},{id:"grafito",nombre:"Grafito",h:240,s:.1}
];
function paletaActual(){ const id=cuenta&&state.ajustes&&state.ajustes.tema&&state.ajustes.tema.id; return PALETAS.find(p=>p.id===id)||PALETAS[0] }
function aplicarTema(){
  const p=paletaActual(), r=document.documentElement;
  r.style.setProperty("--h",p.h); r.style.setProperty("--s",p.s);
  const metas=document.querySelectorAll('meta[name="theme-color"]');
  if(metas[0]) metas[0].content=`hsl(${p.h} ${Math.min(100,p.s*60)}% 96%)`;
  if(metas[1]) metas[1].content=`hsl(${p.h} ${Math.min(100,p.s*25)}% 12%)`;
}
/* ---------- Diseños exclusivos (los da el admin; cada profe decide si lo usa) ---------- */
const EXCLUSIVOS = {
  mariposa:{nombre:"Tu nombre en neón", titulo:c=>c.nombre, lema:"asistencia · baile urbano", colores:false},
  clara:{nombre:"Claramente Dance", titulo:()=>"Claramente", lema:"Dance", colores:false},
  musa:{nombre:"La Musa", titulo:()=>"LA MUSA", lema:"Arte y creación", html:'<span class="musa-logo" aria-label="La Musa" style="display:contents"><span class="la">LA</span><span class="m">M</span><span>USA</span></span>', lemaHtml:'ARTE <svg viewBox="0 0 20 11" aria-hidden="true"><path d="M0 0l9 5.5L0 11zM10 0l9 5.5-9 5.5z" fill="currentColor"/></svg> CREACIÓN', colores:false}
};
function disenoActivo(){
  const d=cuenta&&cuenta.diseno; if(!d||!EXCLUSIVOS[d]) return null;
  const t=(state.ajustes&&state.ajustes.tema)||{};
  return (t.exclusivo===true||t.mariposa===true)?d:null;
}
function mariposaActiva(){ return disenoActivo()==="mariposa" }
function ponerBrillos(){
  const f=$(".fondo-clara"); if(f.dataset.listo) return; f.dataset.listo="1";
  const cols=["#FFE7A3","#FFFFFF","#E9B949","#FF8FCF","#F5D27A"]; let h="";
  for(let i=0;i<22;i++){ const t=(Math.random()*2.5+2.2).toFixed(1), d=(Math.random()*4).toFixed(1), z=Math.round(Math.random()*12+6);
    h+=`<svg style="left:${(Math.random()*100).toFixed(1)}%;top:${(Math.random()*100).toFixed(1)}%;width:${z}px;height:${z}px;color:${cols[i%5]};--t:${t}s;--d:-${d}s;--o:${(Math.random()*.5+.5).toFixed(2)}"><use href="#brillo"/></svg>` }
  f.insertAdjacentHTML("beforeend",h);
}
function hojaTemas(){
  const actual=paletaActual().id, d=cuenta&&cuenta.diseno, X=d&&EXCLUSIVOS[d], activo=disenoActivo();
  const mini = d==="musa" ? `<span class="mini mini-musa"><b><span class="musa-logo" style="display:contents"><span class="la" style="writing-mode:vertical-rl;transform:rotate(180deg);color:#D4F53C">LA</span><span style="color:#8B3DFF">M</span><span>USA</span></span></b><i></i><i></i></span>`
    : d==="clara" ? `<span class="mini mini-clara"><b>Claramente</b><i></i><i></i></span>`
    : `<span class="mini mini-neon"><b>${esc(cuenta.nombre)}</b><i></i><i></i></span>`;
  const exclusivo = X ? `<div class="section-title" style="margin-top:4px">Tu tema exclusivo <span class="exclusivo" style="margin:0 0 0 6px">Solo para ti</span></div>
  <div class="disenos"><button data-exclusivo="1" aria-pressed="${!!activo}">${mini}${X.nombre}</button></div>
  <div class="section-title">Temas para todas</div>` : "";
  return `<h2>Temas</h2><p class="sub">Elige cómo quieres ver tu app. Se guarda con tu código.</p>${exclusivo}
  <div class="temas" role="group" aria-label="Temas">${PALETAS.map(p=>{const sat=k=>Math.min(100,p.s*k);
    return `<button data-tema="${p.id}" aria-pressed="${!activo&&p.id===actual}"><span class="muestra" style="background:linear-gradient(135deg,hsl(${p.h} ${sat(35)}% 47%) 0 45%,hsl(${p.h} ${sat(50)}% 66%) 45% 72%,hsl(${p.h} ${sat(60)}% 93%) 72%)"></span>${p.nombre}</button>`}).join("")}</div>`;
}
const ui = { tab:"lista", grupo:null, fecha:hoyISO(), filtro:"todos", q:"", sheet:null, readonly:false };
let db = null, ready = false;

/* ---------- utilidades ---------- */
function hoyISO(d=new Date()){const z=n=>String(n).padStart(2,"0");return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`}
function parseISO(s){const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)}
function addDias(s,n){const d=parseISO(s);d.setDate(d.getDate()+n);return hoyISO(d)}
function fechaLarga(s){return parseISO(s).toLocaleDateString("es-ES",{weekday:"long",day:"numeric",month:"long"})}
function fechaCorta(s){return parseISO(s).toLocaleDateString("es-ES",{weekday:"short",day:"numeric",month:"short"})}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function iniciales(n){return (n||"?").trim().split(/\s+/).slice(0,2).map(p=>p[0]).join("").toUpperCase()}
function porNombre(a,b){return (a.nombre||"").localeCompare(b.nombre||"","es")}
const $ = s => document.querySelector(s);

function toast(msg){const t=document.createElement("div");t.className="toast";t.setAttribute("role","status");t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}

/* ---------- datos ---------- */
const grupos = () => Object.entries(state.grupos).map(([id,g])=>({id,...g})).sort((a,b)=>(a.orden??0)-(b.orden??0)||porNombre(a,b));
const alumnosDe = gid => Object.entries(state.alumnos).map(([id,a])=>({id,...a})).filter(a=>gid==="todos"||a.grupoId===gid).sort(porNombre);
const sesionesDe = gid => Object.values(state.asistencia).filter(s=>s.grupoId===gid).sort((a,b)=>a.fecha<b.fecha?1:-1);

function resumenAlumno(a){
  const ses = sesionesDe(a.grupoId).filter(s=>s.marcas && s.marcas[a.id] && (!a.alta || s.fecha>=a.alta));
  let si=0,tarde=0,no=0; const hist=[];
  for(const s of ses){const m=s.marcas[a.id]; if(m==="si")si++; else if(m==="tarde")tarde++; else if(m==="no")no++; hist.push({fecha:s.fecha,m})}
  const total=si+tarde+no; return {si,tarde,no,total,pct: total?Math.round((si+tarde)/total*100):null, hist};
}

/* ---------- Conexión con la nube ---------- */
const NUBE = { url:"https://syqatbycpbbbjhfmocrh.supabase.co", clave:"sb_publishable_geNwe7EjJNQw81ydrDcdFQ_CqZkt6g2" };
const K_CUENTA = "asistencia-baile-cuenta";
let cuenta = null;      // {codigo, nombre, es_admin}
let cola = {};          // "coleccion/id" -> datos (null = borrar), pendiente de subir
let enviando = false, tEnvio = null, tReintento = null, ultimaSync = 0;

async function rpc(fn, args){
  const r = await fetch(`${NUBE.url}/rest/v1/rpc/${fn}`, {method:"POST", headers:{"apikey":NUBE.clave,"Content-Type":"application/json"}, body:JSON.stringify(args)});
  if(!r.ok){ let msg=""; try{ msg=(await r.json()).message||"" }catch(e){} const err=new Error(msg||("http "+r.status)); err.servidor=true; err.msg=msg; throw err; }
  const t = await r.text(); return t ? JSON.parse(t) : null;
}
function formatoCodigo(c){ return (c||"").match(/.{1,4}/g)?.join("-") || "" }
function limpiarCodigo(c){ return (c||"").toUpperCase().replace(/[^A-Z0-9]/g,"") }

const kDatos = () => "asistencia-baile-datos-"+cuenta.codigo;
const kCola  = () => "asistencia-baile-cola-"+cuenta.codigo;
function guardarCuenta(){ try{ cuenta?localStorage.setItem(K_CUENTA,JSON.stringify(cuenta)):localStorage.removeItem(K_CUENTA) }catch(e){} }
function saveLocal(){ if(!cuenta) return; try{ localStorage.setItem(kDatos(),JSON.stringify(state)); localStorage.setItem(kCola(),JSON.stringify(cola)) }catch(e){} }
function loadLocal(){
  state.grupos={}; state.alumnos={}; state.asistencia={}; state.ajustes={}; cola={};
  try{ const d=JSON.parse(localStorage.getItem(kDatos())||"null"); if(d){ state.grupos=d.grupos||{}; state.alumnos=d.alumnos||{}; state.asistencia=d.asistencia||{}; state.ajustes=d.ajustes||{} }
       cola=JSON.parse(localStorage.getItem(kCola())||"{}")||{} }catch(e){}
}

function ponEstado(est){
  const el=$("#estado"); if(!el) return;
  const textos={pendiente:"Guardando…", "sin-red":"Sin conexión · se guardará al volver", error:"No se ha podido guardar · lo reintento solo"};
  el.hidden=!textos[est]; el.textContent=textos[est]||"";
}

/* Guarda en el móvil al momento y sube a la nube en segundo plano */
function guardar(col,id,data){
  if(data===null) delete state[col][id]; else state[col][id]=data;
  cola[col+"/"+id]=data;
  saveLocal(); render(); programarEnvio(col==="asistencia"?600:0);
}
function programarEnvio(ms){ clearTimeout(tEnvio); tEnvio=setTimeout(enviar,ms) }
async function enviar(){
  if(enviando||!cuenta) return;
  const claves=Object.keys(cola); if(!claves.length){ ponEstado("ok"); return }
  enviando=true; ponEstado("pendiente");
  const lote=claves.slice(0,400).map(k=>{const i=k.indexOf("/"); return {c:k.slice(0,i), id:k.slice(i+1), d:cola[k]===undefined?null:cola[k]}});
  const enviados=lote.map(x=>[x.c+"/"+x.id, cola[x.c+"/"+x.id]]);
  try{
    await rpc("guardar",{p_codigo:cuenta.codigo,p_cambios:lote});
    for(const [k,v] of enviados) if(cola[k]===v) delete cola[k];
    saveLocal(); enviando=false;
    if(Object.keys(cola).length) return enviar();
    ponEstado("ok");
  }catch(e){
    enviando=false;
    if(e.servidor && /codigo_no_valido/.test(e.msg)) return codigoRevocado();
    ponEstado(e.servidor?"error":"sin-red");
    clearTimeout(tReintento); tReintento=setTimeout(enviar,20000);
  }
}

/* Trae lo último de la nube (por si se usó desde otro móvil) */
async function sincronizar(){
  if(!cuenta) return null;
  ultimaSync=Date.now();
  try{
    const r=await rpc("cargar",{p_codigo:cuenta.codigo});
    if(!r){ codigoRevocado(); return null }
    cuenta.nombre=r.perfil.nombre; cuenta.es_admin=r.perfil.es_admin; cuenta.diseno=r.perfil.diseno||null; guardarCuenta();
    const nuevo={grupos:{},alumnos:{},asistencia:{},ajustes:{}};
    for(const x of r.registros) if(nuevo[x.c]) nuevo[x.c][x.id]=x.d;
    for(const [k,v] of Object.entries(cola)){ const i=k.indexOf("/"), c=k.slice(0,i), id=k.slice(i+1); if(!nuevo[c]) continue; if(v===null) delete nuevo[c][id]; else nuevo[c][id]=v }
    Object.assign(state,nuevo); saveLocal(); render(); enviar();
    return r.registros.length;
  }catch(e){ ponEstado(e.servidor?"error":"sin-red"); return null }
}

/* La primera vez, sube lo que ya había en este móvil de la versión sin códigos */
function traerDatosAntiguos(){
  try{
    if(localStorage.getItem(LS+"-migrado")) return 0;
    const viejo=JSON.parse(localStorage.getItem(LS)||"null"); if(!viejo) return 0;
    let n=0;
    for(const c of ["grupos","alumnos","asistencia"]) for(const [id,v] of Object.entries(viejo[c]||{})){
      if(!v||v.ejemplo) continue; state[c][id]=v; cola[c+"/"+id]=v; n++;
    }
    localStorage.setItem(LS+"-migrado",cuenta.codigo);
    if(n){ saveLocal(); enviar() }
    return n;
  }catch(e){ return 0 }
}

function codigoRevocado(){
  salir(true);
  toast("Tu código ya no está activo. Pide uno nuevo a The Wild Side.");
}
function salir(borrarTodo){
  if(cuenta && borrarTodo){ try{ localStorage.removeItem(kDatos()); localStorage.removeItem(kCola()) }catch(e){} }
  cuenta=null; guardarCuenta(); cola={}; state.grupos={}; state.alumnos={}; state.asistencia={}; state.ajustes={};
  ui.tab="lista"; ui.grupo=null; ui.profes=null; ponEstado("ok"); cerrarHoja(); render();
}

/* ---------- vistas ---------- */
const BUT = '<svg aria-hidden="true"><use href="#mariposa"/></svg>';
function vacio(titulo,texto,boton,accion){return `<div class="empty">${BUT}<h2>${titulo}</h2><p>${texto}</p>${boton?`<button class="primary" data-act="${accion}">${boton}</button>`:""}</div>`}

function bannerEjemplo(){
  const hay=[state.grupos,state.alumnos,state.asistencia].some(c=>Object.values(c).some(x=>x.ejemplo));
  return hay?`<div class="banner"><span>Hay clases y una crew de ejemplo para que veas cómo funciona.</span><button data-act="borrar-ejemplos">Borrar ejemplos</button></div>`:"";
}

function chipsGrupos(incluirTodos){
  const gs=grupos(); const sel=incluirTodos?ui.filtro:ui.grupo;
  return `<div class="chips" role="group" aria-label="Grupo">${incluirTodos?`<button class="chip" data-grupo="todos" aria-pressed="${sel==="todos"}">Todos</button>`:""}${gs.map(g=>`<button class="chip" data-grupo="${g.id}" aria-pressed="${sel===g.id}">${esc(g.nombre)}${g.hora?`<small>${esc(g.hora)}</small>`:""}</button>`).join("")}</div>`;
}

function vistaLista(){
  const gs=grupos();
  if(!gs.length) return vacio("Que empiece la sesión","Crea tu primera clase (por ejemplo, «Infantil martes y jueves») y luego añade a tu crew.","Crear clase","nuevo-grupo");
  if(!ui.grupo||!state.grupos[ui.grupo]){const dw=parseISO(ui.fecha).getDay(); ui.grupo=(gs.find(g=>(g.dias||[]).includes(dw))||gs[0]).id}
  const g=state.grupos[ui.grupo]; const al=alumnosDe(ui.grupo).filter(a=>!a.alta||a.alta<=ui.fecha);
  const ses=state.asistencia[ui.grupo+"_"+ui.fecha]; const marcas=(ses&&ses.marcas)||{};
  const vinieron=al.filter(a=>marcas[a.id]==="si"||marcas[a.id]==="tarde").length;
  const marcados=al.filter(a=>marcas[a.id]).length;
  const tocaHoy=(g.dias||[]).includes(parseISO(ui.fecha).getDay());
  let html=chipsGrupos(false)+`
  <div class="datebar">
    <button class="arrow" data-act="dia" data-n="-1" aria-label="Día anterior">‹</button>

function vistaProfes(){

  if(ui.profes.error) return vacio("No se han podido cargar","Revisa la conexión y vuelve a intentarlo.","Reintentar","recargar-profes");
  const ps=ui.profes.lista.filter(p=>!p.es_admin);
  const activas=ps.filter(p=>p.activo).length, ninos=ps.reduce((n,p)=>n+(+p.alumnos||0),0), clases=ps.reduce((n,p)=>n+(+p.clases||0),0);
  let html=`<div class="resumen-profes"><div class="stat"><b>${activas}</b><span>profes activas</span></div><div class="stat"><b>${ninos}</b><span>niños</span></div><div class="stat"><b>${clases}</b><span>listas pasadas</span></div></div>`;
  if(!ps.length) return html+vacio("Aún no hay profes","Crea un código para cada profe y mándaselo con el enlace de la app.",null)+fab("Nueva profe","nueva-profe");
  html+=`<ul class="list">`;
  for(const p of ps){
    const meta = p.ultima_clase ? `${p.alumnos} niños · ${p.grupos} ${+p.grupos===1?"clase":"clases"} · pasó lista el ${esc(fechaCorta(p.ultima_clase))}` : (p.ultimo_acceso ? `${p.alumnos} niños · aún no ha pasado lista` : "Todavía no ha entrado");

  return `<div class="partitura" aria-label="Últimas ${h.length} clases"><div class="cab"><span>Su beat</span><small>ÚLTIMAS ${h.length} CLASES</small></div><div class="pads">${pads.join("")}</div>

  if(act==="recargar-profes"){ ui.profes=null; render(); return}
  if(act==="nueva-profe"){ abrirHoja(hojaNuevaProfe()); return}
  if(act==="ver-profe"){ abrirHoja(hojaProfe(el.dataset.id)); return}
  if(act==="copiar-inv"){ const t=$("#msgInv"); const ok=()=>toast("Mensaje copiado. Pégalo en WhatsApp.");
    try{ navigator.clipboard.writeText(t.value).then(ok,()=>{t.select();document.execCommand("copy");ok()}) }catch(err){ t.select(); try{document.execCommand("copy");ok()}catch(e2){toast("Mantén pulsado el texto para copiarlo.")} } return}
  if(act==="diseno-profe"){ const id=el.dataset.id, d=el.dataset.diseno;
    rpc("admin_diseno",{p_codigo:cuenta.codigo,p_id:id,p_diseno:d}).then(()=>{ const p=ui.profes.lista.find(x=>x.id===id); if(p) p.diseno=d||null; abrirHoja(hojaProfe(id)); toast(d?"Ya le sale su tema exclusivo en Temas.":"Ahora solo tiene los temas para todas.") },
      ()=>toast("No se ha podido cambiar. Revisa la conexión."));
    return}
  if(act==="activar-profe"){ const id=el.dataset.id, activo=el.dataset.activo==="1";
    if(!activo && !el.dataset.ok){ el.dataset.ok="1"; el.textContent="¿Seguro? Pulsa otra vez"; return }
    el.disabled=true;
    rpc("admin_activar",{p_codigo:cuenta.codigo,p_id:id,p_activo:activo}).then(()=>{ const p=ui.profes.lista.find(x=>x.id===id); if(p) p.activo=activo; abrirHoja(hojaProfe(id)); render(); toast(activo?"Profe activada":"Profe desactivada") },
      ()=>{ el.disabled=false; toast("No se ha podido cambiar. Revisa la conexión.") });
    return}
  if(act==="borrar-ejemplos"){ for(const c of ["asistencia","alumnos","grupos"]) for(const [id,v] of Object.entries(state[c])) if(v.ejemplo) guardar(c,id,null); ui.grupo=null; toast("Ejemplos borrados. Ya puedes crear tus clases."); return}
});
document.addEventListener("submit",e=>{
  e.preventDefault();
  if(e.target.id==="fEntrar") return entrarConCodigo(e.target);
  if(e.target.id==="fProfe") return crearProfe(e.target);
  if(e.target.id==="fAlumno"){const id=e.target.dataset.id||uid(); const prev=state.alumnos[id]||{alta:hoyISO()};
    const nombre=$("#aNombre").value.trim(); if(!nombre) return;
    const a={...prev,nombre,grupoId:$("#aGrupo").value,contacto:$("#aContacto").value.trim(),nota:$("#aNota").value.trim()}; delete a.ejemplo;
    guardar("alumnos",id,a); cerrarHoja(); toast(e.target.dataset.id?"Cambios guardados":`${nombre} añadido a la lista`)}
  if(e.target.id==="fGrupo"){const id=e.target.dataset.id||uid(); const prev=state.grupos[id]||{orden:grupos().length+1};
    const nombre=$("#gNombre").value.trim(); if(!nombre) return;
    const dias=[...document.querySelectorAll("#gDias [aria-pressed='true']")].map(b=>+b.dataset.dia);
    const g={...prev,nombre,dias,hora:$("#gHora").value}; delete g.ejemplo;
    guardar("grupos",id,g); if(!e.target.dataset.id) ui.grupo=id; cerrarHoja(); toast(e.target.dataset.id?"Clase guardada":"Clase creada")}
});
document.addEventListener("input",e=>{ if(e.target.id==="buscar"){ui.q=e.target.value;render()} });
document.addEventListener("change",e=>{ if(e.target.id==="fecha"&&e.target.value){ui.fecha=e.target.value;render()}
  if(e.target.id==="importar"&&e.target.files[0]){ const r=new FileReader(); r.onload=()=>{ try{ const d=JSON.parse(r.result); if(d.app!=="asistencia-baile"||!d.grupos) throw 0;
      state.grupos=d.grupos; state.alumnos=d.alumnos||{}; state.asistencia=d.asistencia||{}; saveLocal(); ui.grupo=null; render(); toast("Copia recuperada"); }catch(err){ toast("Ese archivo no es una copia de esta app.") } }; r.readAsText(e.target.files[0]); e.target.value=""; } });
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&ui.sheet) cerrarHoja() });

async function entrarConCodigo(form){
  const btn=form.querySelector("button"), err=$("#errEntrar"), codigo=limpiarCodigo($("#codigo").value);
  if(codigo.length<8){ err.textContent="El código tiene 12 letras y números."; return }
  btn.disabled=true; btn.textContent="Comprobando…"; err.textContent="";
  try{
    const p=await rpc("entrar",{p_codigo:codigo});
    if(!p){ err.textContent="Ese código no existe o está desactivado. Revísalo o pide uno nuevo."; btn.disabled=false; btn.textContent="Entrar"; return }
    cuenta={codigo,nombre:p.nombre,es_admin:p.es_admin,diseno:p.diseno||null}; guardarCuenta(); loadLocal();
    ui.tab="lista"; ui.grupo=null; render();
    const n=await sincronizar();
    const subidos = n===0 ? traerDatosAntiguos() : 0;
    render();
    toast(subidos?`¡Hola, ${p.nombre}! He subido a tu cuenta lo que ya tenías en este móvil.`:`¡Hola, ${p.nombre}!`);
  }catch(e){ err.textContent="No hay conexión. Revisa la cobertura y vuelve a intentarlo."; btn.disabled=false; btn.textContent="Entrar" }
}
async function crearProfe(form){
  const nombre=$("#pNombre").value.trim(); if(!nombre) return;
  const btn=form.querySelector("button"); btn.disabled=true; btn.textContent="Creando…";
  try{
    const r=await rpc("admin_crear_profe",{p_codigo:cuenta.codigo,p_nombre:nombre});
    ui.profes.lista.push({id:"nueva-"+r.codigo,nombre,codigo:r.codigo,activo:true,es_admin:false,grupos:0,alumnos:0,clases:0,ultimo_acceso:null,ultima_clase:null});
    abrirHoja(hojaProfe("nueva-"+r.codigo)); render(); cargarProfesTrasCrear(r.codigo);
  }catch(e){ btn.disabled=false; btn.textContent="Crear código"; toast("No se ha podido crear. Revisa la conexión.") }
}
async function cargarProfesTrasCrear(codigo){
  try{ const l=await rpc("admin_profes",{p_codigo:cuenta.codigo}); if(l){ ui.profes={lista:l}; render();
    const p=l.find(x=>x.codigo===codigo); const h=$("#sheetHost .sheet"); if(p&&h&&$("#msgInv")) abrirHoja(hojaProfe(p.id)); } }catch(e){}
}
addEventListener("online",()=>{ enviar(); sincronizar() });
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible"&&cuenta&&Date.now()-ultimaSync>30000) sincronizar() });

/* ---------- arranque ---------- */
function iniciar(){
  try{ cuenta=JSON.parse(localStorage.getItem(K_CUENTA)||"null") }catch(e){ cuenta=null }
  try{ navigator.storage && navigator.storage.persist && navigator.storage.persist() }catch(e){}
  if(cuenta&&cuenta.codigo){ loadLocal(); ready=true; render(); sincronizar() }
  else { cuenta=null; ready=true; render() }
}
iniciar();
})();
</script>
<script>
if("serviceWorker" in navigator){ addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{})) }
</script>
